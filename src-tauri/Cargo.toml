[package]
name = "app"
version = "2026.6.7"
description = "DevStatus: live dashboard for developer-service status pages"
authors = ["Jonathan Boho <552156+jboho@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/jboho/dev-status"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# native-tls: delegates to macOS SecureTransport, which unconditionally respects all
# keychain trust settings — including Zscaler's root CA regardless of how it was installed.
# rustls-native-certs misses certs with per-app or purpose-restricted trust settings.
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
