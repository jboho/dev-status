# Triggered by version tags (e.g. v2026.6.3).
# Builds native installers on each platform and attaches them to a draft GitHub Release.
name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions: {}

jobs:
  release:
    name: Tauri ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest runners are Apple Silicon, so a default build ships nothing an Intel
          # Mac can run. One universal binary covers both architectures from the same runner.
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.os }}
    # Notarization waits on Apple's service, so the macOS leg runs longer than a plain build.
    timeout-minutes: 60
    # Secrets are scoped to this environment (limited to v* tags) once it is created.
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust / Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # An absent secret is exported as an empty string, and the Tauri bundler treats
      # "set but empty" as a real value: an empty APPLE_CERTIFICATE fails the keychain
      # import, and empty notarization credentials fail notarytool auth. So export the set
      # only once it is fully populated — a fork without secrets still builds ad-hoc signed.
      - name: Configure Apple signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          vars=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          missing=()
          for v in "${vars[@]}"; do
            [ -n "${!v}" ] || missing+=("$v")
          done

          if [ "${#missing[@]}" -eq "${#vars[@]}" ]; then
            echo "::warning::No Apple signing secrets configured - the macOS bundle will be ad-hoc signed and not notarized."
            exit 0
          fi

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Apple signing is partially configured. Missing secrets: ${missing[*]}"
            exit 1
          fi

          for v in "${vars[@]}"; do
            printf '%s<<__SECRET_EOF__\n%s\n__SECRET_EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          echo "APPLE_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          echo "Apple signing and notarization enabled."

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        # APPLE_* signing vars arrive from the step above via $GITHUB_ENV. Deliberately no
        # APPLE_SIGNING_IDENTITY: the bundler derives the identity from the certificate and
        # errors out if an explicitly provided one disagrees with it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: DevStatus ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # The bundler notarizes and staples the .app but only code-signs the .dmg around it
      # (tauri-bundler/src/bundle/macos/dmg/mod.rs has no notarize call), so the disk image
      # people actually download assesses as "Unnotarized Developer ID" and Gatekeeper blocks
      # it on open. Notarize and staple it here, then replace the asset tauri-action uploaded.
      - name: Notarize and staple the macOS disk image
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          find src-tauri/target -type f -path '*/release/bundle/dmg/*.dmg' > "$RUNNER_TEMP/dmgs.txt"
          count=$(wc -l < "$RUNNER_TEMP/dmgs.txt" | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one .dmg to notarize, found $count"
            cat "$RUNNER_TEMP/dmgs.txt"
            exit 1
          fi
          dmg=$(cat "$RUNNER_TEMP/dmgs.txt")
          echo "Notarizing $dmg"

          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1 | tee "$RUNNER_TEMP/notarize.log"

          # --wait exits non-zero on a hard failure, but a completed-and-rejected submission
          # still reads as success, so assert on the reported status too.
          grep -q 'status: Accepted' "$RUNNER_TEMP/notarize.log" || {
            echo "::error::Notarization did not return Accepted for $(basename "$dmg")"
            exit 1
          }

          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          # Apple's prescribed Gatekeeper check for a disk image (the app inside uses -t install).
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber
