# Quality + security gate, then Tauri bundles (Windows + macOS).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (Prettier)
        run: pnpm run format:check

      - name: Unit tests (Vitest)
        run: pnpm run test:run

      - name: Test coverage (HTML report)
        run: pnpm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Production build (tsc + Vite)
        run: pnpm run build

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  desktop:
    name: Tauri ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (runs `pnpm build` via beforeBuildCommand)
        run: pnpm tauri build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: dev-status-bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
